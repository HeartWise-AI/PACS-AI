name: Agent release tooling tests

on:
  pull_request:
    paths:
      - 'tools/release/**'
      - '.github/workflows/agent-release-*.yml'
  push:
    branches: ['ci/agent-release-candidates']
    paths:
      - 'tools/release/**'
      - '.github/workflows/agent-release-*.yml'

permissions:
  contents: read

concurrency:
  group: agent-release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Release tooling contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test CLI with disposable Git and simulated GitHub
        run: python3 -m unittest discover -s tools/release/tests -v
