name: Staging release validation

on:
  pull_request:
    branches: ['staging-release-*']
    types: [opened, reopened, synchronize, ready_for_review, edited, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: staging-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # Draft staging PRs run without self-hosted runner access or deployment secrets.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.18.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Set up workspace package manager
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install candidate dependencies
        run: bun install --frozen-lockfile --no-save
      - name: Test candidate commit
        run: bun run test:unit:ci
