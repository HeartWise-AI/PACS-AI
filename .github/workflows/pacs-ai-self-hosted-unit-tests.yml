name: PACS-AI self-hosted unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    if: github.event.pull_request.draft == false
    environment: pacs-self-hosted
    runs-on:
      group: pacs-approved
      labels: [self-hosted, linux, x64, sd4health, pacs-ai, cpu]
    timeout-minutes: 60

    steps:
      - name: Checkout the exact PR commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 24.22.2, as OHIF 3.13 (.node-version); the runner needs Node 24.
          node-version-file: .node-version

      - name: Set up pnpm
        # The version in package.json "packageManager".
        run: npm install -g pnpm@12.8.1

      - name: Show runner diagnostics
        run: |
          hostname
          node --version
          pnpm --version
          nproc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit:ci
