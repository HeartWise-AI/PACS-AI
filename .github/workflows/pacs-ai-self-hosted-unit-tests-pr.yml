name: PACS-AI self-hosted unit tests

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        edited,
        closed,
        converted_to_draft,
      ]

permissions:
  contents: read

# A title or description edit must not cancel a queued or approved test run
# for the same commit, so such edits get their own group and skip the job.
# Edits that change the base branch still replace the previous run.
concurrency:
  group: >-
    pacs-self-hosted-pr-${{ github.event.pull_request.number }}${{
    (github.event.action == 'edited' && !github.event.changes.base) && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'converted_to_draft' &&
      !(github.event.action == 'edited' && !github.event.changes.base) &&
      github.event.pull_request.draft == false
    uses: HeartWise-AI/PACS-AI/.github/workflows/pacs-ai-self-hosted-unit-tests.yml@main
