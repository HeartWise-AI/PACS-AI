name: Agent candidate build only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-candidate-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Native component packages (not staging)
    if: startsWith(github.ref_name, 'staging-release-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify immutable paired sources and packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py inspect --manifest .release/candidate.json
      - name: Package native Dockerfiles without publication
        run: python3 tools/release/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-only-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-build
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
