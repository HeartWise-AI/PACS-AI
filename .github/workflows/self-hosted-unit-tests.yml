name: PACS-AI self-hosted unit tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pacs-self-hosted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    if: github.event.pull_request.draft == false
    environment: pacs-self-hosted
    runs-on: [self-hosted, linux, x64, sd4health, pacs-ai, cpu]
    timeout-minutes: 60

    steps:
      - name: Checkout the exact PR commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.18.1

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Show runner diagnostics
        run: |
          hostname
          node --version
          yarn --version
          bun --version
          nproc

      - name: Install dependencies
        run: bun install --no-save

      - name: Run unit tests
        run: bun run test:unit:ci
