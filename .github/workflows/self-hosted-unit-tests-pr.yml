name: PACS-AI self-hosted unit tests

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        edited,
        closed,
        converted_to_draft,
      ]

permissions:
  contents: read

concurrency:
  group: pacs-self-hosted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'converted_to_draft' &&
      github.event.pull_request.draft == false
    uses: HeartWise-AI/PACS-AI/.github/workflows/self-hosted-unit-tests.yml@main
